[theme]
base = "dark"
primaryColor = "#F5B942"
backgroundColor = "#070A12"
secondaryBackgroundColor = "#0E1526"
textColor = "#F9FAFB"
font = "sans serif"

[server]
headless = true
port = 8501
enableCORS = false
enableXsrfProtection = false
enableWebsocketCompression = true
maxUploadSize = 25

[browser]
gatherUsageStats = false

[client]
toolbarMode = "minimal"
showErrorDetails = true
showSidebarNavigation = false
